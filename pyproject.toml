[project]
name = "todo-app"
version = "0.1.0"
description = "Todo App with CLI and SQL database support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "sqlmodel>=0.0.22",
]

[tool.uv.workspace]
members = [
    "phase2-web",
    "phase3-todo-ai-chatbot",
    "phase4-docker",
    "phase5-advanced-cloud-deployment",
]
